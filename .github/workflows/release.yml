# When a v1.x.y release is published: write its notes from CHANGELOG.md. When it becomes a full
# release (published as one, or a checked pre-release promoted to one), move the major tag (v1) so
# `uses: kalmwerk/peppol-ubl-check@v1` picks it up. Publishing as a pre-release first lets the tag,
# notes and attached files be checked before anyone on @v1 gets the new version.
name: Release

on:
  release:
    types: [published, released]

permissions:
  contents: write

jobs:
  notes:
    if: ${{ github.event.action == 'published' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Kalmwerk's free release-notes Action: fills the release from the matching CHANGELOG.md section
      - uses: kalmwerk/release-notes-action@v1
        with:
          source: changelog

  major-tag:
    # `released` fires for a full release only: published directly, or a pre-release promoted later
    if: ${{ github.event.action == 'released' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Move the major version tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          MAJOR="${TAG%%.*}"
          case "$MAJOR" in v[0-9]*) ;; *) echo "::error::Tag $TAG isn't vX.Y.Z" && exit 1 ;; esac
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"
